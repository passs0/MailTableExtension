name: Cellmate
options:
  bundleIdPrefix: com.passs0
  deploymentTarget:
    macOS: "13.0"
  fileTypes:
    icon:
      file: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Cellmate:
    type: application
    platform: macOS
    sources:
      - path: CellmateHost
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passs0.Cellmate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Cellmate"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        ASSETCATALOG_COMPILER_APPICON_NAME: Cellmate
        CODE_SIGN_ENTITLEMENTS: CellmateHost/CellmateHost.entitlements
    dependencies:
      - target: CellmateExtension
        embed: true

  CellmateExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: CellmateExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passs0.Cellmate.CellmateExtension
        INFOPLIST_FILE: CellmateExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: CellmateExtension/CellmateExtension.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - sdk: MailKit.framework
