name: Tabulate
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
  fileTypes:
    icon:
      file: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Tabulate:
    type: application
    platform: macOS
    sources:
      - path: MailTableHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Tabulate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tabulate"
        ASSETCATALOG_COMPILER_APPICON_NAME: Tabulate
        CODE_SIGN_ENTITLEMENTS: MailTableHost/MailTableHost.entitlements
    dependencies:
      - target: TabulateExtension
        embed: true

  TabulateExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: MailTableExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Tabulate.TabulateExtension
        INFOPLIST_FILE: MailTableExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MailTableExtension/MailTableExtension.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - sdk: MailKit.framework
