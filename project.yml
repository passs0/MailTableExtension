name: MailTableExtension
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MailTableHost:
    type: application
    platform: macOS
    sources:
      - path: MailTableHost
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MailTableHost
        INFOPLIST_KEY_CFBundleDisplayName: "Mail Table Builder"
        CODE_SIGN_ENTITLEMENTS: MailTableHost/MailTableHost.entitlements
    dependencies:
      - target: MailTableExtension
        embed: true

  MailTableExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: MailTableExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MailTableHost.MailTableExtension
        INFOPLIST_FILE: MailTableExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: MailTableExtension/MailTableExtension.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
    dependencies:
      - sdk: MailKit.framework
